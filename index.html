<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bestfriends</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%AD%90%3C/text%3E%3C/svg%3E">
<style>
  :root{--cyan:#7af0ff;--violet:#a07bff;--gold:#ffd27a;--ink:#eaf6ff}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#02010a;overflow:hidden;color:var(--ink);
    font-family:"Trebuchet MS",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #gl{z-index:0}
  #ov{z-index:1;pointer-events:none}

  .card{background:linear-gradient(160deg,rgba(30,22,60,.9),rgba(8,10,28,.92));
    border:1px solid rgba(160,123,255,.35);border-radius:22px;padding:30px 26px 24px;
    text-align:center;box-shadow:0 0 60px rgba(122,240,255,.12),0 20px 60px rgba(0,0,0,.6);
    width:min(340px,calc(100vw - 32px));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

  #intro{position:fixed;inset:0;display:grid;place-items:center;z-index:5;
    transition:opacity 1.8s ease,transform 2.4s ease,filter 1.8s ease}
  #intro.out{opacity:0;transform:scale(1.12);filter:blur(6px);pointer-events:none}
  #intro h1{font-size:30px;letter-spacing:.5px;margin:14px 0 6px;
    background:linear-gradient(90deg,var(--cyan),var(--violet),var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  #intro .para{opacity:.8;font-size:15px;margin-bottom:18px}
  .planet{width:86px;height:86px;margin:4px auto 0;position:relative;animation:float 4s ease-in-out infinite}
  .planet::before{content:"";position:absolute;inset:14px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff6d8,#ffd27a 30%,#b77bff 75%,#4a2fa0);
    box-shadow:0 0 30px rgba(255,210,122,.45)}
  .planet .ring{position:absolute;left:-4px;right:-4px;top:36px;height:16px;border-radius:50%;
    border:3px solid rgba(122,240,255,.85);transform:rotate(-16deg);box-shadow:0 0 14px rgba(122,240,255,.6)}
  @keyframes float{50%{transform:translateY(-6px)}}

  button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:11px 26px;font-weight:700;
    color:#120a2a;background:linear-gradient(90deg,var(--cyan),var(--gold));
    box-shadow:0 0 22px rgba(122,240,255,.35);transition:transform .15s,opacity .8s}
  button:active{transform:scale(.95)}
  button.ghost{background:transparent;color:var(--ink);border:1px solid rgba(234,246,255,.3);box-shadow:none}
  #noMusic{display:none;font-size:12px;opacity:.55;color:var(--ink);text-decoration:underline;background:none;box-shadow:none;padding:6px;font-weight:400}

  /* Spotify */
  #spotSlot{display:none;height:152px;margin:4px 0 10px}
  #spotHint{display:none;font-size:14px;color:var(--cyan);margin-bottom:10px;animation:float 2s ease-in-out infinite}
  body.spotify #spotSlot,body.spotify #spotHint{display:block}
  body.spotify #noMusic{display:inline-block}
  body.spotify #go{display:none}
  #spotBox{position:fixed;z-index:7;display:none;border-radius:14px;overflow:hidden;background:#121212;box-shadow:0 0 30px rgba(122,240,255,.18)}
  #spotBox iframe{display:block;width:100%!important;height:100%!important;border:0}
  #spotBox.intro{display:block;transition:opacity 1.4s ease}
  #spotBox.intro.fade{opacity:0;pointer-events:none}
  #spotBox.panel{display:block;z-index:4;left:16px;bottom:78px;width:min(330px,calc(100vw - 32px));height:min(420px,62vh);
    opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .35s,transform .35s}
  #spotBox.panel.open{opacity:1;transform:none;pointer-events:auto}

  #top{position:fixed;top:calc(16px + env(safe-area-inset-top));left:0;right:0;text-align:center;z-index:2;pointer-events:none;
    opacity:0;transform:translateY(-8px);transition:opacity 1.6s,transform 1.6s}
  #top.on{opacity:1;transform:none}
  #top .small{display:block;font-size:12px;letter-spacing:3px;text-transform:uppercase;opacity:.65}
  #top .big{display:block;font-size:24px;font-weight:700;margin-top:2px;
    background:linear-gradient(90deg,var(--cyan),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}

  #hint{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:14px;opacity:0;z-index:2;
    pointer-events:none;transition:opacity 1.2s}
  #hint.on{opacity:.9}
  #hint span{background:rgba(10,8,30,.6);border:1px solid rgba(160,123,255,.3);padding:8px 16px;border-radius:999px}

  .fab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));width:50px;height:50px;padding:0;font-size:22px;z-index:3;
    opacity:0;pointer-events:none;transition:opacity 1s}
  .fab.on{opacity:1;pointer-events:auto}
  .fab{white-space:nowrap}
  #msgBtn{right:16px}
  #musicBtn{left:16px}
  #giftBtn{left:50%;transform:translateX(-50%);width:auto;padding:0 20px;font-size:15px;animation:glow 1.8s ease-in-out infinite}
  #giftBtn:active{transform:translateX(-50%) scale(.95)}
  @keyframes glow{50%{box-shadow:0 0 0 8px rgba(255,210,122,.12),0 0 34px rgba(255,210,122,.7)}}

  #msg{position:fixed;inset:0;display:grid;place-items:center;z-index:6;background:rgba(3,2,10,.45);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .4s}
  #msg.on{opacity:1;pointer-events:auto}
  #msg .card{transform:scale(.9);transition:transform .4s}
  #msg.on .card{transform:none}
  #mEmoji{font-size:56px;line-height:1;margin-bottom:10px;filter:drop-shadow(0 0 16px rgba(255,210,122,.5))}
  #mTitle{font-size:22px;margin-bottom:10px;color:var(--gold)}
  #mText{font-size:15.5px;line-height:1.55;opacity:.92;margin-bottom:20px}
  #mFirma{font-size:13px;opacity:.7;margin:-8px 0 18px;font-style:italic}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .dots{display:flex;gap:6px;justify-content:center;margin-top:16px}
  .dots i{width:7px;height:7px;border-radius:50%;background:rgba(234,246,255,.25)}
  .dots i.on{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
  .dots i.seen{background:rgba(122,240,255,.5)}

  #finalText{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom));text-align:center;z-index:3;pointer-events:none;
    font-size:clamp(15px,4vw,19px);font-style:italic;opacity:0;transition:opacity 2s;padding:0 24px;text-shadow:0 0 18px #000}
  #finalText.on{opacity:.9}
  #finalText .firma{margin-top:8px;font-size:.9em;color:var(--gold);opacity:.9}
  #backBtn{left:50%;transform:translateX(-50%);width:auto;padding:0 20px;font-size:14px}
  #backBtn:active{transform:translateX(-50%) scale(.95)}
  #bbText{position:fixed;left:0;right:0;top:62%;text-align:center;z-index:3;pointer-events:none;padding:0 24px;
    font-family:Georgia,serif;font-style:italic;font-size:clamp(18px,5vw,26px);letter-spacing:.5px;color:#f4ecff;
    opacity:0;filter:blur(6px);transition:opacity 1.4s ease,filter 1.4s ease;text-shadow:0 0 24px rgba(160,123,255,.7)}
  #bbText.on{opacity:.92;filter:none}
  #nogl{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:30px;z-index:9}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>

<div id="intro">
  <div class="card">
    <div class="planet"><div class="ring"></div></div>
    <h1>Bestfriends</h1>
    <p class="para">Para <b class="nombre"></b></p>
    <p id="spotHint">Dale play ▶ a tu música para empezar</p>
    <div id="spotSlot"></div>
    <button id="go">Iniciar ✨</button>
    <button id="noMusic">o entrar sin música</button>
  </div>
</div>
<div id="spotBox"><div id="spotEmbed"></div></div>

<div id="top"><span class="small">una galaxia para</span><span class="big" id="topName"></span></div>
<div id="hint"><span>Tocá las estrellitas ✨</span></div>
<button id="msgBtn" class="fab" title="Mensajes">✉️</button>
<button id="musicBtn" class="fab ghost" title="Música">🎵</button>
<button id="giftBtn" class="fab">🎁 Sorpresa</button>
<button id="backBtn" class="fab ghost">Volver a la galaxia ✨</button>
<div id="finalText"></div>
<div id="bbText"></div>

<div id="msg">
  <div class="card">
    <div id="mEmoji"></div>
    <h2 id="mTitle"></h2>
    <p id="mText"></p>
    <p id="mFirma"></p>
    <div class="row">
      <button id="mNext">Siguiente ✨</button>
      <button id="mClose" class="ghost">Cerrar</button>
    </div>
    <div class="dots" id="mDots"></div>
  </div>
</div>
<div id="nogl"><p>Tu navegador no puede mostrar la galaxia 3D 😢<br>Probá abrirla en Chrome o Safari actualizados.</p></div>

<script>
/* =========================================================
   ✏️  EDITÁ ACÁ  ✏️
   ========================================================= */
const CONFIG = {
  nombre: "Caterine",            // <- el nombre de tu amiga (se forma con estrellas en la sorpresa)
  titulo: "mi mejor amiga",      // <- lo que dice arriba en la galaxia: "una galaxia para ..."
  firma:  "— Con cariño, Kashi 🌟",                    // <- ej: "— Tu amigo de siempre" (aparece en el último mensaje y en la sorpresa)

  // 🎵 SPOTIFY: link de la playlist. La galaxia arranca cuando ella le da play.
  // Si lo dejás vacío "", aparece un botón "Iniciar" sin música.
  spotify: "https://open.spotify.com/playlist/2MY2ljio24Y6vkBCtLPZI4?si=aa93997dc6244e01",

  frases: [                      // frases que giran en la galaxia
    "MEJOR AMIGA ★",
    "TE QUIERO MUCHO",
    "AMISTAD INFINITA ∞",
    "GRACIAS POR EXISTIR",
    "HERMANA DE LA VIDA",
    "SIEMPRE CONTÁS CONMIGO",
    "AMIGOS PARA SIEMPRE",
    "MI CÓMPLICE DE RISAS",
    "BEST FRIENDS ★"
  ],

  mensajes: [                    // lo que aparece al tocar las estrellitas
    { emoji:"🌟", titulo:"Mejor amiga",
      texto:"De todas las personas del universo, qué suerte que me tocaste vos como amiga." },
    { emoji:"🫂", titulo:"Gracias",
      texto:"Por bancarme, por las charlas eternas y por estar siempre, en mis mejores y en mis peores momentos." },
    { emoji:"😂", titulo:"Cómplices",
      texto:"Las mejores risas y los peores chistes los compartí con vos. Que no se terminen nunca." },
    { emoji:"🪐", titulo:"Pase lo que pase",
      texto:"Acá vas a tener siempre a alguien que te banca. Eso no cambia nunca." },
    { emoji:"✨", titulo:"Te quiero mucho, amiga",
      texto:"Sos como la hermana que elegí. Esta galaxia es toda tuya." }
  ],

  // 💥 BIG BANG: la frase que aparece en la oscuridad antes de la explosión
  bigbang: "Todo empezó con una chispa…",

  // 🎁 SORPRESA FINAL: las estrellas forman el nombre y esta frase
  sorpresa: {
    frase: "gracias por estar siempre",   // va debajo del nombre, hecha de estrellas
    texto: "Toda esta galaxia existe porque vos existís ✨"   // aparece abajo, en letra chiquita
  }
};
/* ========================================================= */

const $ = id => document.getElementById(id);
const qp = new URLSearchParams(location.search);
if (qp.get("para")) CONFIG.nombre = qp.get("para");
document.querySelectorAll(".nombre").forEach(e => e.textContent = CONFIG.nombre);
$("bbText").textContent = CONFIG.bigbang || "";
$("topName").textContent = CONFIG.titulo || CONFIG.nombre;

const TAU = Math.PI * 2, rnd = Math.random;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const smooth = (a, b, t) => { t = clamp((t - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const gauss = () => (rnd() + rnd() + rnd() + rnd() - 2) * 0.87;

/* =========================================================
   WebGL
   ========================================================= */
const glc = $("gl"), ov = $("ov"), o2 = ov.getContext("2d");
const gl = glc.getContext("webgl", { antialias: false, alpha: false, premultipliedAlpha: false, powerPreference: "high-performance" });
if (!gl) { $("nogl").style.display = "grid"; throw new Error("no webgl"); }

let W, H, DPR, PORT, FOCAL;
const FOV = 55 * Math.PI / 180;
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = Math.max(1, innerWidth); H = Math.max(1, innerHeight); PORT = H > W;
  glc.width = ov.width = Math.round(W * DPR); glc.height = ov.height = Math.round(H * DPR);
  gl.viewport(0, 0, glc.width, glc.height);
  FOCAL = (H / 2) / Math.tan(FOV / 2);
}
addEventListener("resize", resize); resize();

function shader(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, shader(gl.VERTEX_SHADER, vs)); gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const info = { p, a: {}, u: {} };
  for (let i = 0; i < gl.getProgramParameter(p, gl.ACTIVE_ATTRIBUTES); i++) { const n = gl.getActiveAttrib(p, i).name; info.a[n] = gl.getAttribLocation(p, n); }
  for (let i = 0; i < gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i++) { const n = gl.getActiveUniform(p, i).name; info.u[n] = gl.getUniformLocation(p, n); }
  return info;
}
function buffer(data, dynamic) {
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, data, dynamic ? gl.DYNAMIC_DRAW : gl.STATIC_DRAW); return b;
}
function attr(prog, name, buf, size) {
  const loc = prog.a[name]; if (loc === undefined || loc < 0) return;
  gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
}
function disableAttrs(prog) { for (const k in prog.a) if (prog.a[k] >= 0) gl.disableVertexAttribArray(prog.a[k]); }

/* ---------- matrices ---------- */
const VIEW = new Float32Array(16), PROJ = new Float32Array(16);
function perspective(out, fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far); out.fill(0);
  out[0] = f / aspect; out[5] = f; out[10] = (far + near) * nf; out[11] = -1; out[14] = 2 * far * near * nf;
}
function lookAt(out, e, c) {
  let zx = e[0] - c[0], zy = e[1] - c[1], zz = e[2] - c[2], l = Math.hypot(zx, zy, zz); zx /= l; zy /= l; zz /= l;
  let xx = zz, xy = 0, xz = -zx; l = Math.hypot(xx, xz) || 1; xx /= l; xz /= l;       // up = (0,1,0)
  const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
  out[0] = xx; out[1] = yx; out[2] = zx; out[3] = 0; out[4] = xy; out[5] = yy; out[6] = zy; out[7] = 0;
  out[8] = xz; out[9] = yz; out[10] = zz; out[11] = 0;
  out[12] = -(xx * e[0] + xy * e[1] + xz * e[2]); out[13] = -(yx * e[0] + yy * e[1] + yz * e[2]);
  out[14] = -(zx * e[0] + zy * e[1] + zz * e[2]); out[15] = 1;
}
// proyecta a pantalla (px CSS). devuelve false si está detrás
const SP = [0, 0, 0];
function toScreen(x, y, z) {
  const vx = VIEW[0] * x + VIEW[4] * y + VIEW[8] * z + VIEW[12];
  const vy = VIEW[1] * x + VIEW[5] * y + VIEW[9] * z + VIEW[13];
  const vz = VIEW[2] * x + VIEW[6] * y + VIEW[10] * z + VIEW[14];
  if (vz > -1) return false;
  const k = FOCAL / -vz;
  SP[0] = W / 2 + vx * k; SP[1] = H / 2 - vy * k; SP[2] = k; return true;
}

/* ---------- shaders ---------- */
const FS_POINT = `precision mediump float;
varying vec3 vColor; varying float vAlpha;
void main(){ vec2 c = gl_PointCoord - 0.5; float d = length(c); if (d > 0.5) discard;
  float a = pow(1.0 - d * 2.0, 1.7) + 0.5 * pow(1.0 - d * 2.0, 6.0);
  gl_FragColor = vec4(vColor * a * vAlpha, 1.0); }`;

const GALAXY = program(`
attribute vec3 aGal; attribute vec3 aStart; attribute vec3 aTarget; attribute vec3 aColor; attribute vec2 aMisc;
uniform mat4 uView, uProj; uniform float uTime, uForm, uMorph, uSize, uFade, uBang, uHeat, uSuck, uCharge, uMaxPt;
varying vec3 vColor; varying float vAlpha;
void main(){
  float r = aGal.x, rnd = aMisc.y;
  float sp = 0.045 + 0.25 * exp(-r / 6.0);
  float ang = aGal.y + uTime * sp;
  vec3 g = vec3(cos(ang) * r, aGal.z, sin(ang) * r);
  float e = clamp(uForm * 1.6 - rnd * 0.6, 0.0, 1.0); e = e * e * (3.0 - 2.0 * e);
  // big bang: salen todas del centro (las rápidas primero) y después se arremolinan
  float bk = clamp(uBang * (0.75 + rnd * 0.5), 0.0, 1.0);
  vec3 boom = aStart * 0.55 * (1.0 - pow(1.0 - bk, 3.0));
  float sw = (1.0 - e) * (2.2 + rnd * 1.5) * uForm;
  float cs = cos(sw), sn = sin(sw);
  boom = vec3(boom.x * cs - boom.z * sn, boom.y * (1.0 - 0.6 * uForm), boom.x * sn + boom.z * cs);
  vec3 p = mix(boom, g, e);
  // el agujero negro devora todo: espiral hacia el centro (las de adentro primero)
  float sk = clamp(uSuck * 1.4 - rnd * 0.2 - min(length(p.xz) / 90.0, 1.0) * 0.25, 0.0, 1.0); sk = sk * sk;
  float pr = length(p.xz), pa = atan(p.z, p.x) + sk * (4.0 + 26.0 / (pr + 5.0));
  float nr = pr * (1.0 - sk);
  p = vec3(cos(pa) * nr, p.y * (1.0 - sk), sin(pa) * nr);
  float m = clamp(uMorph * 1.6 - rnd * 0.6, 0.0, 1.0); m = m * m * (3.0 - 2.0 * m);
  vec3 t = aTarget + vec3(sin(uTime * 1.7 + rnd * 60.0), cos(uTime * 1.3 + rnd * 40.0), sin(uTime + rnd * 9.0)) * 0.12
          + vec3(sin(uTime * 61.0 + rnd * 900.0), cos(uTime * 53.0 + rnd * 700.0), sin(uTime * 47.0 + rnd * 300.0)) * uCharge * 0.9;
  float arc = sin(m * 3.14159);
  p = mix(p, t, m) + vec3((rnd - 0.5) * 18.0, (fract(rnd * 7.31) - 0.5) * 34.0, (fract(rnd * 3.7) - 0.5) * 26.0) * arc;
  vec4 mv = uView * vec4(p, 1.0);
  gl_Position = uProj * mv;
  float tw = 0.72 + 0.28 * sin(uTime * (0.8 + rnd * 3.0) + rnd * 50.0);
  gl_PointSize = clamp(uSize * aMisc.x / -mv.z, 1.0, uMaxPt) * (1.0 + 0.35 * m) * (1.0 + 3.0 * uHeat);
  vec3 hot = mix(vec3(1.0, 0.95, 0.85), mix(vec3(1.0, 0.6, 0.25), vec3(0.6, 0.45, 1.0), rnd), clamp(1.0 - uHeat * 1.4, 0.0, 1.0));
  vColor = mix(aColor, hot * 1.4, uHeat);
  vAlpha = tw * (0.6 + 0.4 * e) * (1.0 + uHeat) * uFade * smoothstep(0.0, 0.015, uBang);
  vColor = mix(vColor, vec3(1.0, 0.72, 0.42) * 1.6, sk * 0.7 * (1.0 - m));
  vAlpha *= 1.0 - smoothstep(0.82, 1.0, sk) * (1.0 - m);
  vAlpha *= mix(smoothstep(4.0, 26.0, -mv.z), 1.0, max(uHeat, m));   // las que pasan muy cerca de la cámara se desvanecen
}`, FS_POINT);

const POINTS = program(`
attribute vec3 aPos; attribute vec3 aColor; attribute vec2 aSA;
uniform mat4 uView, uProj; uniform float uSize, uFixed;
varying vec3 vColor; varying float vAlpha;
void main(){
  vec4 mv = uView * vec4(aPos, 1.0);
  gl_Position = uProj * mv;
  gl_PointSize = uFixed > 0.5 ? aSA.x * uSize : clamp(uSize * aSA.x / -mv.z, 0.5, 64.0);
  vColor = aColor; vAlpha = aSA.y;
}`, FS_POINT);

// quads: brillos, nebulosas, agujero negro y disco
const QUAD = program(`
attribute vec2 aCorner;
uniform mat4 uView, uProj; uniform vec3 uCenter, uAX, uAY;
varying vec2 vUV;
void main(){ vUV = aCorner; vec3 p = uCenter + uAX * aCorner.x + uAY * aCorner.y; gl_Position = uProj * uView * vec4(p, 1.0); }`,
`precision mediump float;
varying vec2 vUV; uniform float uMode, uTime, uAlpha, uSeed; uniform vec3 uColor, uColor2;

const fVel = new Float32Array(NF * 3), fT0 = new Float32Array(NF).fill(-99), fLife = new Float32Array(NF), fOrg = new Float32Array(NF * 3);
let fNext = 0;
const bFPos = buffer(fPos, true), bFCol = buffer(fCol, true), bFSA = buffer(fSA, true);
const FW_COLORS = [[1, .82, .4], [.45, .92, 1], [.7, .5, 1], [1, .6, .85], [.6, 1, .75], [1, 1, 1]];
function firework(x, y, z, now) {
  const col = FW_COLORS[(rnd() * FW_COLORS.length) | 0], col2 = FW_COLORS[(rnd() * FW_COLORS.length) | 0];
  const n = 260, sp = 9 + rnd() * 7;
  for (let k = 0; k < n; k++) {
    const i = fNext; fNext = (fNext + 1) % NF;
    const th = rnd() * TAU, ph = Math.acos(2 * rnd() - 1), v = sp * (.75 + rnd() * .25);
    fVel.set([v * Math.sin(ph) * Math.cos(th), v * Math.cos(ph), v * Math.sin(ph) * Math.sin(th) * .5], i * 3);
    fOrg.set([x, y, z], i * 3); fT0[i] = now; fLife[i] = 1.6 + rnd() * 1.2;
    fCol.set(rnd() < .7 ? col : col2, i * 3);
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, bFCol); gl.bufferSubData(gl.ARRAY_BUFFER, 0, fCol);
}

{

  for (let i = 0; i < 16; i++) {
    const a = rnd() * TAU, r = 15 + rnd() * 70, p = palette[i % palette.length];
    NEB.push({ c: [Math.cos(a) * r, gauss() * 6, Math.sin(a) * r], s: 28 + rnd() * 40, col: p[0], col2: p[1], al: .10 + rnd() * .12, seed: rnd() * 40 });

}

  return { r, a: i * TAU / 7 + rnd() * .5, y: 5 + rnd() * 7, ph: rnd() * TAU, sp: 0.045 + 0.25 * Math.exp(-r / 6), sx: -999, sy: -999, hit: 0 };

const cam = { theta: -0.6, phi: 0.35, dist: 330, tx: 0, ty: 4, tz: 0 };
const camGoal = () => ({ phi: PORT ? 1.1 : 1.15, dist: PORT ? 148 : 108 });
let autoRot = true, yawVel = 0;
function eye() {
  return [cam.tx + cam.dist * Math.sin(cam.phi) * Math.cos(cam.theta), cam.ty + cam.dist * Math.cos(cam.phi), cam.tz + cam.dist * Math.sin(cam.phi) * Math.sin(cam.theta)];

/* ---------- interacción ---------- */
const ptrs = new Map(); let moved = 0, pinch0 = 0, dist0 = 0, userCtl = false;
glc.addEventListener("pointerdown", e => {
  glc.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = 0;
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); dist0 = cam.dist; }
  if (spotM) spotBox.classList.remove("open");
});
glc.addEventListener("pointermove", e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY; moved += Math.abs(dx) + Math.abs(dy);
  if (!userCtl) return;
  if (ptrs.size === 1) { yawVel = dx * 0.006; cam.theta += dx * 0.006; cam.phi = clamp(cam.phi - dy * 0.005, 0.3, 1.5); }
  else if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; cam.dist = clamp(dist0 * pinch0 / Math.hypot(a.x - b.x, a.y - b.y), 45, 260); }
});
glc.addEventListener("pointerup", e => { if (ptrs.size === 1 && moved < 8) tap(e.clientX, e.clientY); ptrs.delete(e.pointerId); });
glc.addEventListener("pointercancel", e => ptrs.delete(e.pointerId));
glc.addEventListener("wheel", e => { e.preventDefault(); if (userCtl) cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.001), 45, 260); }, { passive: false });

let starScreen = { x: -999, y: -999, r: 0 };
function tap(x, y) {
  if (!userCtl) return;
  for (const c of clickStars) if (Math.hypot(x - c.sx, y - c.sy) < c.hit) { openMsg(); return; }
  if (Math.hypot(x - starScreen.x, y - starScreen.y) < starScreen.r) openMsg();
}

// posiciones del texto con estrellas
let finalDist = 160, ringRX = 60, ringRY = 30;
function buildTextTargets() {
  const cw = PORT ? 900 : 1400, ch = PORT ? 900 : 640;
  const c = document.createElement("canvas"); c.width = cw; c.height = ch; const x = c.getContext("2d");
  x.fillStyle = "#fff"; x.textAlign = "center"; x.textBaseline = "middle";
  const fit = (txt, max, size, weight) => { let s = size; do { x.font = `${weight} ${s}px "Trebuchet MS", Arial, sans-serif`; s -= 4; } while (x.measureText(txt).width > max && s > 20); return s + 4; };
  const wrap = (txt, max) => { const words = txt.split(" "), lines = []; let l = ""; for (const w of words) { const t = l ? l + " " + w : w; if (x.measureText(t).width > max && l) { lines.push(l); l = w; } else l = t; } if (l) lines.push(l); return lines; };
  const nameSize = fit(CONFIG.nombre, cw * .9, PORT ? 230 : 250, 900);
  x.font = `900 ${nameSize}px "Trebuchet MS", Arial, sans-serif`;
  const nameLines = wrap(CONFIG.nombre, cw * .92);
  const fr = CONFIG.sorpresa.frase || "";
  const frSize = Math.min(PORT ? 96 : 92, nameSize * .5);
  x.font = `700 ${frSize}px "Trebuchet MS", Arial, sans-serif`;
  const frLines = fr ? wrap(fr, cw * .9) : [];
  const total = nameLines.length * nameSize * 1.05 + (frLines.length ? frSize * .6 + frLines.length * frSize * 1.15 : 0);
  let yy = ch / 2 - total / 2;
  x.font = `900 ${nameSize}px "Trebuchet MS", Arial, sans-serif`;
  for (const l of nameLines) { x.fillText(l, cw / 2, yy + nameSize * .52); yy += nameSize * 1.05; }
  yy += frSize * .6; x.font = `700 ${frSize}px "Trebuchet MS", Arial, sans-serif`;
  for (const l of frLines) { x.fillText(l, cw / 2, yy + frSize * .55); yy += frSize * 1.15; }
  const data = x.getImageData(0, 0, cw, ch).data, pts = [];
  const step = 3;
  for (let py = 0; py < ch; py += step) for (let px = 0; px < cw; px += step) if (data[(py * cw + px) * 4 + 3] > 140) pts.push([px, py]);
  const worldW = PORT ? 62 : 120, sc = worldW / cw;
  // tamaño real del texto, para que el anillo lo rodee sin pisarlo
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (const p of pts) { if (p[0] < minX) minX = p[0]; if (p[0] > maxX) maxX = p[0]; if (p[1] < minY) minY = p[1]; if (p[1] > maxY) maxY = p[1]; }
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  const hw = (maxX - minX) / 2 * sc, hh = (maxY - minY) / 2 * sc;
  ringRX = hw * 1.22 + 3; ringRY = Math.max(hh * 1.75 + 4, ringRX * (PORT ? .55 : .42));
  if (PORT) ringRY = Math.max(ringRY, ringRX * 1.05);
  for (let i = 0; i < NG; i++) {
    if (i % 10 < 7 && pts.length) {
      const p = pts[(rnd() * pts.length) | 0];
      gTarget.set([(p[0] - cx) * sc + gauss() * .12, -(p[1] - cy) * sc + gauss() * .12, gauss() * .4], i * 3);
    } else {                                  // anillo de polvo brillante alrededor
      const a = rnd() * TAU, k = 1 + Math.abs(gauss()) * .05 + Math.sin(a * 6) * .015;
      gTarget.set([Math.cos(a) * ringRX * k, Math.sin(a) * ringRY * k, gauss() * 2 - 4], i * 3);
    }
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, bTarget); gl.bufferSubData(gl.ARRAY_BUFFER, 0, gTarget);
  // distancia para que entre en pantalla
  // distancia para que el anillo entero entre en pantalla (dejando lugar abajo para el texto)
  const aspect = W / H;
  finalDist = Math.max((ringRX * 2 * 1.12) / (2 * Math.tan(FOV / 2) * aspect), (ringRY * 2 * 1.75) / (2 * Math.tan(FOV / 2)));
}

/* estado general */
let started = false, T0 = 0, last = performance.now(), gt = 0;
let form = 0, morph = 0, morphGoal = 0, sceneFade = 1;
let tween = null, fwTimer = 0, surprise = false, arrived = false, backing = false, sT0 = 0, suck = 0, sNow = 0, hyper = false, hT0 = 0;

function tweenCam(to, dur, done, ease) {
  const from = { ...cam };
  let th = to.theta; if (th !== undefined) { while (th - from.theta > Math.PI) th -= TAU; while (th - from.theta < -Math.PI) th += TAU; }
  const dest = { ...to }; if (th !== undefined) dest.theta = th; else delete dest.theta;
  tween = { from, to: dest, t0: performance.now(), dur, done, ease };
}

function startSurprise() {
  if (surprise) return;
  surprise = true; userCtl = false; autoRot = false; yawVel = 0;
  ["giftBtn", "msgBtn", "hint", "top"].forEach(id => $(id).classList.remove("on"));
  $("musicBtn").classList.remove("on");
  buildTextTargets();
  backing = false; sT0 = performance.now();
  // la cámara se acerca al agujero negro mientras devora todo
  tweenCam({ phi: PORT ? 1.05 : 1.08, dist: PORT ? 105 : 78, ty: 0 }, 4.6);
  setTimeout(() => { try { navigator.vibrate && navigator.vibrate([30, 60, 50, 50, 90, 40, 300]); } catch (e) {} }, 3800);
  // ya dentro del agujero de gusano: la cámara se pone de frente para el nombre
  setTimeout(() => { tween = null; cam.theta = Math.PI / 2; cam.phi = Math.PI / 2; cam.dist = finalDist; cam.ty = -ringRY * .28; }, 6500);
  // salida del túnel: las estrellas forman el nombre
  setTimeout(() => { if (!backing) { morphGoal = 1; fwTimer = 2.2; } }, 9500);
  $("finalText").innerHTML = ""; $("finalText").append(CONFIG.sorpresa.texto);
  if (CONFIG.firma) { const f = document.createElement("div"); f.className = "firma"; f.textContent = CONFIG.firma; $("finalText").append(f); }
  setTimeout(() => { if (!backing) $("finalText").classList.add("on"); }, 14500);
  setTimeout(() => { if (!backing) $("backBtn").classList.add("on"); }, 17000);
}
const easeOutBack = x => { const c1 = 1.25, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
$("backBtn").onclick = () => {
  if (hyper) return;
  $("backBtn").classList.remove("on"); $("finalText").classList.remove("on");
  fwTimer = 0; backing = true; hyper = true; hT0 = performance.now();
  try { navigator.vibrate && navigator.vibrate([20, 40, 30, 40, 60, 30, 400]); } catch (e) {}
  // detrás de las líneas de luz: la galaxia vuelve a armarse y la cámara se aleja
  setTimeout(() => {
    morph = 0; morphGoal = 0; suck = 0; tween = null;
    const g = camGoal();
    cam.theta = Math.PI / 2 - 1.1; cam.phi = g.phi; cam.ty = 4; cam.dist = g.dist * 3.2;
    // frenada con un pequeño rebote
    setTimeout(() => tweenCam({ dist: g.dist }, 2.4, null, easeOutBack), 1300);
  }, 1900);
  setTimeout(() => {
    hyper = false; surprise = false; backing = false; userCtl = true; autoRot = true;
    ["msgBtn", "giftBtn", "top"].forEach(id => $(id).classList.add("on"));
    if (spotM) $("musicBtn").classList.add("on");
  }, 5600);
};

/* =========================================================
   Render
   ========================================================= */
function drawQuad(center, ax, ay, mode, color, color2, alpha, seed, time) {
  gl.uniform3fv(QUAD.u.uCenter, center); gl.uniform3fv(QUAD.u.uAX, ax); gl.uniform3fv(QUAD.u.uAY, ay);
  gl.uniform1f(QUAD.u.uMode, mode); gl.uniform3fv(QUAD.u.uColor, color); gl.uniform3fv(QUAD.u.uColor2, color2 || color);
  gl.uniform1f(QUAD.u.uAlpha, alpha); gl.uniform1f(QUAD.u.uSeed, seed || 0); gl.uniform1f(QUAD.u.uTime, time);
  gl.drawArrays(gl.TRIANGLES, 0, 6);
}
function drawPoints(pos, col, sa, n, size, fixed) {
  gl.useProgram(POINTS.p);
  gl.uniformMatrix4fv(POINTS.u.uView, false, VIEW); gl.uniformMatrix4fv(POINTS.u.uProj, false, PROJ);
  gl.uniform1f(POINTS.u.uSize, size); gl.uniform1f(POINTS.u.uFixed, fixed ? 1 : 0);
  attr(POINTS, "aPos", pos, 3); attr(POINTS, "aColor", col, 3); attr(POINTS, "aSA", sa, 2);
  gl.drawArrays(gl.POINTS, 0, n); disableAttrs(POINTS);
}

let shooting = [];
function frame(now) {
  const rdt = Math.min(.5, (now - last) / 1000), dt = Math.min(.05, rdt); last = now;
  const time = now / 1000;
  if (started) { gt += dt; T0 += 0; }
  const T = started ? (now - T0) / 1000 : 0;
  const TG = T - OFF;   // tiempo de la galaxia (después del big bang)

  /* --- animaciones --- */
  if (started) {
    form = clamp(TG / 5.2, 0, 1);
    if (!tween && !surprise && !arrived) {          // llegada de la cámara
      const k = easeIO(clamp(TG / 7.5, 0, 1)), g = camGoal();
      cam.dist = lerp(330, g.dist, k); cam.phi = lerp(0.35, g.phi, k); cam.theta = -0.6 + k * 1.2;
      if (TG >= 7.5) { arrived = true; if (!surprise) userCtl = true; }
    }
  }
  morph += clamp(morphGoal - morph, -rdt / 4.5, rdt / 4.5);
  sNow = surprise ? (now - sT0) / 1000 : 0;
  if (surprise && !backing) { const x = clamp((sNow - .3) / 4.6, 0, 1); suck = x * x * x; }
  else suck = Math.max(0, suck - rdt / 4.5);
  sceneFade = (1 - smooth(0, .35, morph)) * (1 - smooth(.04, .45, suck));
  if (tween) {
    const x = clamp((now - tween.t0) / 1000 / tween.dur, 0, 1), k = (tween.ease || easeIO)(x);
    for (const key in tween.to) cam[key] = lerp(tween.from[key], tween.to[key], k);
    if (x >= 1) { const d = tween.done; tween = null; d && d(); }
  } else if (userCtl && !ptrs.size) { yawVel *= .94; cam.theta += yawVel + dt * 0.06; }

  if (surprise && morph > .55) {
    fwTimer -= rdt;
    if (fwTimer <= 0) {
      fwTimer = .45 + rnd() * .6;
      const ww = PORT ? 38 : 75, hh = PORT ? 60 : 32;
      firework((rnd() * 2 - 1) * ww, (rnd() * 2 - 1) * hh, -15 - rnd() * 25, time);
    }
  }

  /* --- matrices --- */
  perspective(PROJ, FOV, W / H, 0.5, 3000);
  const E = eye();
  if (hyper) { const h = (now - hT0) / 1000, sh = 2.2 * smooth(.3, 1.2, h) * (1 - smooth(3.4, 4.0, h)); E[0] += (rnd() - .5) * sh; E[1] += (rnd() - .5) * sh; E[2] += (rnd() - .5) * sh; }
  if (surprise && !backing && sNow > 1.5 && sNow < 6.2) { const sh = 2.6 * smooth(1.5, 4.8, sNow) * (1 - smooth(5.6, 6.2, sNow)); E[0] += (rnd() - .5) * sh; E[1] += (rnd() - .5) * sh; E[2] += (rnd() - .5) * sh; }
  if (started && T > TB && T < TB + 2.5) { const sh = 7 * Math.exp(-(T - TB) * 2.6); E[0] += (rnd() - .5) * sh; E[1] += (rnd() - .5) * sh; E[2] += (rnd() - .5) * sh; }
  lookAt(VIEW, E, [cam.tx, cam.ty, cam.tz]);
  const RX = [VIEW[0], VIEW[4], VIEW[8]], UY = [VIEW[1], VIEW[5], VIEW[9]];
  const sc = (v, s) => [v[0] * s, v[1] * s, v[2] * s];

  gl.clearColor(0.008, 0.004, 0.03, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); gl.disable(gl.DEPTH_TEST); gl.depthMask(false);

  // estrellas de fondo (titilan)
  for (let i = 0; i < NB; i++) bgSA[i * 2 + 1] = (.25 + .35 * Math.sin(time * (0.6 + (i % 7) * .3) + bgPh[i])) + .3;
  const bgDim = !started ? 1 : T < TB ? 1 - .85 * smooth(.3, TB - .3, T) : .15 + .85 * smooth(TB + .5, TB + 4, T);
  if (bgDim < 1) for (let i = 0; i < NB; i++) bgSA[i * 2 + 1] *= bgDim;
  gl.bindBuffer(gl.ARRAY_BUFFER, bBgSA); gl.bufferSubData(gl.ARRAY_BUFFER, 0, bgSA);
  drawPoints(bBgPos, bBgCol, bBgSA, NB, DPR, true);

  if (started) {
    // nebulosas
    gl.useProgram(QUAD.p);
    gl.uniformMatrix4fv(QUAD.u.uView, false, VIEW); gl.uniformMatrix4fv(QUAD.u.uProj, false, PROJ);
    attr(QUAD, "aCorner", quadBuf, 2);
    const nebA = smooth(-1.5, 6, TG) * (0.35 + 0.65 * sceneFade);
    for (const n of NEB) drawQuad(n.c, sc(RX, n.s), sc(UY, n.s), 3, n.col, n.col2, n.al * nebA, n.seed, time);
    // brillo del núcleo
    const coreA = smooth(-2, 5, TG) * sceneFade;
    drawQuad([0, 0, 0], sc(RX, 26), sc(UY, 26), 0, [.55, .4, 1], null, .35 * coreA, 0, time);
    drawQuad([0, 0, 0], sc(RX, 14), sc(UY, 14), 0, [1, .8, .5], null, .3 * coreA, 0, time);

    // agujero negro: escribe profundidad para tapar lo que está detrás
    gl.enable(gl.DEPTH_TEST);
    const holeK = Math.max(sceneFade, surprise && !backing ? 1 - smooth(5.0, 5.8, sNow) : 0);
    if (holeK > .02) {
      gl.depthMask(true); gl.blendFunc(gl.ONE, gl.ZERO);
      const bh = 2.6 * smooth(1.5, 3.5, TG) * holeK * (1 + suck * 2.6) + .001;
      drawQuad([0, 0, 0], sc(RX, bh), sc(UY, bh), 1, [0, 0, 0], null, 1, 0, time);
      gl.depthMask(false); gl.blendFunc(gl.ONE, gl.ONE);
      // disco de acreción (en el plano de la galaxia)
      const dA = smooth(1.8, 4.5, TG) * holeK * (1 + suck * 1.8), ds = 12 * (1 + suck * 1.5);
      drawQuad([0, 0, 0], [ds, 0, 0], [0, 0, ds], 2, [1, .95, .85], [.4, .75, 1], dA, 0, time + suck * 6);
      // anillo de luz alrededor del agujero (de frente a la cámara)
      const rs = 5.2 * (1 + suck * 2.6);
      drawQuad([0, 0, 0], sc(RX, rs), sc(UY, rs), 0, [1, .9, .75], null, .5 * dA, 0, time);
    }
    disableAttrs(QUAD);

    // galaxia
    gl.useProgram(GALAXY.p);
    gl.uniformMatrix4fv(GALAXY.u.uView, false, VIEW); gl.uniformMatrix4fv(GALAXY.u.uProj, false, PROJ);
    gl.uniform1f(GALAXY.u.uTime, gt); gl.uniform1f(GALAXY.u.uForm, form); gl.uniform1f(GALAXY.u.uMorph, morph);
    gl.uniform1f(GALAXY.u.uSize, 230 * DPR); gl.uniform1f(GALAXY.u.uFade, 1);
    const bx = clamp((T - TB) / 3.2, 0, 1);
    gl.uniform1f(GALAXY.u.uBang, bx); gl.uniform1f(GALAXY.u.uSuck, suck); gl.uniform1f(GALAXY.u.uMaxPt, 7.0 * DPR); gl.uniform1f(GALAXY.u.uCharge, hyper ? smooth(0, 1, (now - hT0) / 1000) * (1 - smooth(1.6, 1.9, (now - hT0) / 1000)) : 0); gl.uniform1f(GALAXY.u.uHeat, T < TB ? 1 : Math.exp(-(T - TB) * .55));
    attr(GALAXY, "aGal", bGal, 3); attr(GALAXY, "aStart", bStart, 3); attr(GALAXY, "aTarget", bTarget, 3);
    attr(GALAXY, "aColor", bCol, 3); attr(GALAXY, "aMisc", bMisc, 2);
    gl.drawArrays(gl.POINTS, 0, NG); disableAttrs(GALAXY);
    gl.disable(gl.DEPTH_TEST);

    // estrella gigante + chorro
    const st = TG - 4.2;
    if (st > 0 && sceneFade > .01) {
      const spin = Math.sin(gt * .6) * .45, cs = Math.cos(spin), pulse = 1 + .04 * Math.sin(gt * 2.4);
      for (let i = 0; i < NS; i++) {
        const p = clamp((st - sDel[i]) / 1.8, 0, 1);
        const rise = 1 - Math.pow(1 - clamp(p * 1.7, 0, 1), 3), spread = smooth(.45, 1, p);
        const ox = sLoc[i * 2] * cs * STAR_R * pulse * spread, oy = sLoc[i * 2 + 1] * STAR_R * pulse * spread;
        const jx = sJit[i * 2] * (1 - spread), jz = sJit[i * 2 + 1] * (1 - spread);
        sPos[i * 3] = jx + RX[0] * ox + UY[0] * oy; sPos[i * 3 + 1] = STAR_Y * rise + RX[1] * ox + UY[1] * oy; sPos[i * 3 + 2] = jz + RX[2] * ox + UY[2] * oy;
        sSA[i * 2] = sSz[i] * (1 + .25 * Math.sin(gt * 3 + sPh[i])); sSA[i * 2 + 1] = p > 0 ? sceneFade : 0;
      }
      gl.bindBuffer(gl.ARRAY_BUFFER, bSPos); gl.bufferSubData(gl.ARRAY_BUFFER, 0, sPos);
      gl.bindBuffer(gl.ARRAY_BUFFER, bSSA); gl.bufferSubData(gl.ARRAY_BUFFER, 0, sSA);
      const formed = smooth(1.6, 3.4, st);
      gl.useProgram(QUAD.p); attr(QUAD, "aCorner", quadBuf, 2);
      drawQuad([0, STAR_Y, 0], sc(RX, 30), sc(UY, 30), 0, [1, .75, .35], null, .38 * formed * sceneFade, 0, time);
      disableAttrs(QUAD);
      drawPoints(bSPos, bSCol, bSSA, NS, 200 * DPR);
      if (formed > 0) {
        for (let i = 0; i < NQ; i++) {
          const ph = (qPh[i] + gt * .32) % 1;
          qPos.set([qJ[i * 2] * (1 - ph * .8), ph * (STAR_Y - 8), qJ[i * 2 + 1] * (1 - ph * .8)], i * 3);
          qSA.set([1 + (i % 3) * .5, formed * sceneFade * (.4 + .6 * Math.sin(ph * Math.PI))], i * 2);
        }
        gl.bindBuffer(gl.ARRAY_BUFFER, bQPos); gl.bufferSubData(gl.ARRAY_BUFFER, 0, qPos);
        gl.bindBuffer(gl.ARRAY_BUFFER, bQSA); gl.bufferSubData(gl.ARRAY_BUFFER, 0, qSA);
        drawPoints(bQPos, bQCol, bQSA, NQ, 150 * DPR);
      }
    }

    // fuegos artificiales
    let anyFw = false;
    for (let i = 0; i < NF; i++) {
      const t = time - fT0[i];
      if (t < 0 || t > fLife[i]) { fSA[i * 2 + 1] = 0; continue; }
      anyFw = true;
      const drag = (1 - Math.exp(-t * 1.6)) / 1.6;
      fPos[i * 3] = fOrg[i * 3] + fVel[i * 3] * drag;
      fPos[i * 3 + 1] = fOrg[i * 3 + 1] + fVel[i * 3 + 1] * drag - 2.2 * t * t;
      fPos[i * 3 + 2] = fOrg[i * 3 + 2] + fVel[i * 3 + 2] * drag;
      const life = 1 - t / fLife[i];
      fSA[i * 2] = 1.6 + life * 1.4; fSA[i * 2 + 1] = life * life * (.7 + .3 * Math.sin(t * 30 + i));
    }
    if (anyFw) {
      gl.bindBuffer(gl.ARRAY_BUFFER, bFPos); gl.bufferSubData(gl.ARRAY_BUFFER, 0, fPos);
      gl.bindBuffer(gl.ARRAY_BUFFER, bFSA); gl.bufferSubData(gl.ARRAY_BUFFER, 0, fSA);
      drawPoints(bFPos, bFCol, bFSA, NF, 150 * DPR);
    }
  }

  if (started && T < OFF + 2) drawBang(T, time);
  if (surprise && !backing && sNow > 4.0 && sNow < 10.8) drawWorm(sNow, time);
  if (hyper && (now - hT0) / 1000 < 4.6) drawWarp((now - hT0) / 1000, time);
  { const hh = (now - hT0) / 1000, cov = hyper ? smooth(1.0, 1.7, hh) * (1 - smooth(3.3, 4.3, hh)) : 0;
    const o = String(+(1 - cov).toFixed(3)); if (ov.style.opacity !== o) ov.style.opacity = o; }
  drawOverlay(TG, time, dt);
  requestAnimationFrame(frame);
}

/* ---------- capa 2D: frases, estrellitas, estrellas fugaces ---------- */
function starPath(x, y, ro, ri, rot) {
  o2.beginPath();
  for (let j = 0; j < 10; j++) { const a = -Math.PI / 2 + rot + j * Math.PI / 5, r = j % 2 ? ri : ro; j ? o2.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r) : o2.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
  o2.closePath();
}
function drawOverlay(T, time, dt) {
  o2.setTransform(1, 0, 0, 1, 0, 0); o2.clearRect(0, 0, ov.width, ov.height);
  o2.setTransform(DPR, 0, 0, DPR, 0, 0);

  // estrellas fugaces
  if (rnd() < .005) shooting.push({ x: rnd() * W, y: rnd() * H * .45, vx: -(320 + rnd() * 300), vy: 120 + rnd() * 150, life: 1 });
  shooting = shooting.filter(s => s.life > 0);
  o2.globalCompositeOperation = "lighter";
  for (const s of shooting) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt * 1.2;
    const g = o2.createLinearGradient(s.x, s.y, s.x - s.vx * .2, s.y - s.vy * .2);
    g.addColorStop(0, `rgba(220,245,255,${s.life})`); g.addColorStop(1, "rgba(220,245,255,0)");
    o2.strokeStyle = g; o2.lineWidth = 1.6; o2.beginPath(); o2.moveTo(s.x, s.y); o2.lineTo(s.x - s.vx * .2, s.y - s.vy * .2); o2.stroke();
  }
  if (!started) return;

  // frases sobre el plano (acostadas, siguiendo la curva)
  const la = smooth(7, 9, T) * sceneFade;
  if (la > .01) {
    o2.textAlign = "center"; o2.textBaseline = "middle";
    o2.font = "700 15px 'Trebuchet MS',system-ui,sans-serif";
    for (const l of labels) {
      const a = l.a + l.sp * gt, ca = Math.cos(a), sa = Math.sin(a), px = l.r * ca, pz = l.r * sa;
      if (!toScreen(px, l.y, pz)) continue;
      const x0 = SP[0], y0 = SP[1], k = SP[2];
      const d = 1;
      if (!toScreen(px - sa * d, l.y, pz + ca * d)) continue;
      let ax = SP[0] - x0, ay = SP[1] - y0;
      if (!toScreen(px + ca * d, l.y, pz + sa * d)) continue;
      let bx = SP[0] - x0, by = SP[1] - y0;
      if (ax < 0) { ax = -ax; ay = -ay; bx = -bx; by = -by; }
      if (ax * by - ay * bx < 0) { bx = -bx; by = -by; }   // nunca en espejo
      const s = PORT ? 0.2 : 0.15;   // tamaño de las frases
      o2.setTransform(DPR * ax * s, DPR * ay * s, DPR * bx * s, DPR * by * s, DPR * x0, DPR * y0);
      o2.globalAlpha = la * clamp(k / 3.2, .25, 1);
      o2.shadowColor = "rgba(150,110,255,.95)"; o2.shadowBlur = 12;
      o2.fillStyle = l.hue; o2.fillText(l.txt, 0, 0);
    }
    o2.shadowBlur = 0; o2.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  // estrellitas para tocar
  const ca2 = smooth(7.5, 9.5, T) * sceneFade;
  o2.globalCompositeOperation = "source-over";
  for (const c of clickStars) {
    c.sx = c.sy = -999;
    if (ca2 < .01) continue;
    const a = c.a + c.sp * gt, y = c.y + Math.sin(gt * 1.5 + c.ph) * 1.5;
    if (!toScreen(c.r * Math.cos(a), y, c.r * Math.sin(a))) continue;
    const size = clamp(SP[2] * 1.5, 8, 20); c.sx = SP[0]; c.sy = SP[1]; c.hit = Math.max(26, size * 2.2);
    const pul = .5 + .5 * Math.sin(gt * 3 + c.ph);
    const g = o2.createRadialGradient(c.sx, c.sy, 0, c.sx, c.sy, size * 3.2);
    g.addColorStop(0, `rgba(255,210,120,${.55 * ca2})`); g.addColorStop(1, "rgba(255,210,120,0)");
    o2.globalCompositeOperation = "lighter"; o2.globalAlpha = .6 + .4 * pul; o2.fillStyle = g;
    o2.beginPath(); o2.arc(c.sx, c.sy, size * 3.2, 0, TAU); o2.fill();
    o2.globalCompositeOperation = "source-over"; o2.globalAlpha = ca2;
    starPath(c.sx, c.sy, size, size * .45, gt * .8 + c.ph);
    const gr = o2.createRadialGradient(c.sx, c.sy, 0, c.sx, c.sy, size);
    gr.addColorStop(0, "#fffaf0"); gr.addColorStop(.6, "#ffd27a"); gr.addColorStop(1, "#ffb84a");
    o2.fillStyle = gr; o2.fill();
    o2.globalAlpha = ca2 * (1 - pul) * .7; o2.strokeStyle = "#7af0ff"; o2.lineWidth = 1.5;
    o2.beginPath(); o2.arc(c.sx, c.sy, size * (1.4 + pul * .9), 0, TAU); o2.stroke();
  }
  o2.globalAlpha = 1;
  if (toScreen(0, STAR_Y, 0)) starScreen = { x: SP[0], y: SP[1], r: STAR_R * SP[2] * .9 };
}

/* =========================================================
   Inicio (Spotify o botón)
   ========================================================= */
const spotM = (CONFIG.spotify || "").match(/open\.spotify\.com\/(?:intl-[a-z]+\/)?(playlist|album|track|artist)\/([A-Za-z0-9]+)/);
const spotBox = $("spotBox");
function startShow() {
  if (started) return;
  $("intro").classList.add("out");
  if (spotM) {
    spotBox.classList.add("fade");
    setTimeout(() => { spotBox.classList.remove("intro", "fade"); spotBox.removeAttribute("style"); spotBox.classList.add("panel"); }, 1500);
  }
  setTimeout(() => { started = true; T0 = performance.now(); gt = 0; }, 900);
  setTimeout(() => { if (!surprise) $("top").classList.add("on"); }, 9500 + OFF * 1000);
  setTimeout(() => { if (surprise) return; $("hint").classList.add("on"); $("msgBtn").classList.add("on"); if (spotM) $("musicBtn").classList.add("on"); }, 11000 + OFF * 1000);
  setTimeout(() => $("hint").classList.remove("on"), 18000 + OFF * 1000);
  // texto del comienzo + vibración en la explosión
  setTimeout(() => $("bbText").classList.add("on"), 900 + 500);
  setTimeout(() => $("bbText").classList.remove("on"), 900 + (TB - .5) * 1000);
  setTimeout(() => { try { navigator.vibrate && navigator.vibrate([60, 40, 220, 60, 90]); } catch (e) {} }, 900 + TB * 1000);
  // si en un rato no abrió todos los mensajes, igual aparece la sorpresa
  setTimeout(() => { if (!surprise) $("giftBtn").classList.add("on"); }, 100000);
}
$("go").onclick = startShow;
$("noMusic").onclick = startShow;

if (spotM) {
  document.body.classList.add("spotify");
  spotBox.classList.add("intro");
  $("musicBtn").onclick = () => spotBox.classList.toggle("open");
  const place = () => {
    if (!spotBox.classList.contains("intro")) return;
    const r = $("spotSlot").getBoundingClientRect();
    Object.assign(spotBox.style, { left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px" });
  };
  place(); addEventListener("resize", place); const pi = setInterval(() => started ? clearInterval(pi) : place(), 400);
  window.onSpotifyIframeApiReady = API => {
    API.createController($("spotEmbed"),
      { uri: `spotify:${spotM[1]}:${spotM[2]}`, width: "100%", height: 152, theme: "dark" },
      ctrl => ctrl.addListener("playback_update", e => { if (e && e.data && !e.data.isPaused && !e.data.isBuffering) startShow(); }));
  };
  const sc = document.createElement("script"); sc.src = "https://open.spotify.com/embed/iframe-api/v1"; sc.async = true;
  document.head.appendChild(sc);
}

requestAnimationFrame(frame);
</script>
